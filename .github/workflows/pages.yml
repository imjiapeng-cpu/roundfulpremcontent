name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deploy. Skip pending runs in favor of the latest.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Don't deploy when the bot pushes the manifest rebuild — the next user
    # push (or the same workflow run that triggered this) covers it.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The repo IS the static site. No build step.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
